<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <base href="/castle/">
    <title>Howl&#39;s Moving Castle</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <audio src="../assets/in_the_rain.mp3" autoplay loop></audio>
<div class="container">
    <img class="background" src="../assets/background.jpg">

    <img class="cloud-bg" src="../assets/cloud-bg.png">
    <img class="cloud-bg2" src="../assets/cloud-bg.png">

    <div class="castle-container">
        <div class="castle">
            <div class="brleg">
                <img class="brfoot" src="../assets/brfoot.png" />
                <img class="brbottom" src="../assets/brbottom.png" />
            </div>
            <div class="frleg">
                <img class="frfoot" src="../assets/frfoot.png" />
                <img class="frbottom" src="../assets/frbottom.png" />
            </div>
            <img class="chimney3" src="../assets/chimney3.png" />
            <img class="treehouse" src="../assets/treehouse.png" />
            <div class="houses-group">
                <img class="point6" src="../assets/point6.png" />
                <img class="point5" src="../assets/point5.png" />
                <img class="point4" src="../assets/point4.png" />
                <img class="houses" src="../assets/houses.png" />
            </div>
            <img class="chimney2" src="../assets/chimney2.png" />
            <img class="chimney1" src="../assets/chimney1.png" />
            <img class="wing" src="../assets/wing.png" />
            <div class="mound-group">
                <img class="antenna" src="../assets/antenna.png" />
                <img class="point3" src="../assets/point3.png" />
                <img class="point2" src="../assets/point2.png" />
                <img class="point1" src="../assets/point1.png" />
                <img class="mound" src="../assets/mound.png" />
            </div>
            <img class="wind" src="../assets/wind.png" />
            <img class="cannon" src="../assets/cannon.png" />
            <img class="main" src="../assets/main.png" />
            <div class="blleg">
                <div class="blbottom-group">
                    <img class="blfoot" src="../assets/flfoot.png" />
                    <img class="blbottom" src="../assets/flbottom.png" />
                </div>
                <img class="bltop" src="../assets/fltop.png" />
            </div>
            <img class="blcover" src="../assets/blcover.png" />
            <img class="knob" src="../assets/knob.png" />
            <img class="tele" src="../assets/tele.png" />
            <img class="telecover" src="../assets/telecover.png" />
            <div class="flleg">
                <div class="flbottom-group">
                    <img class="flfoot" src="../assets/flfoot.png" />
                    <img class="flbottom" src="../assets/flbottom.png" />
                </div>
                <img class="fltop" src="../assets/fltop.png" />
            </div>
            <img class="flcover" src="../assets/flcover.png" />
        </div>
    </div>
    
    <img class="foreground" src="../assets/foreground.png">
    
    <div class="clouds">
        <img class="cloud-shadow1" src="../assets/cloud_shadow-1.png">
        <img class="cloud-shadow2" src="../assets/cloud_shadow-1.png">
        <img class="cloud-shadow3" src="../assets/cloud_shadow-1.png">
        <img class="cloud1" src="../assets/cloud-1.png">
        <img class="cloud2" src="../assets/cloud-1.png">
        <img class="cloud3" src="../assets/cloud-2.png">
        <img class="cloud4" src="../assets/cloud-1.png">
        <img class="cloud5" src="../assets/cloud-2.png">
    </div>
    
</div>
<div class="control-toggle">Toggle mouse controls</div>
<div class="load-gate">Loading...</div>
    <script src='//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src='//cdnjs.cloudflare.com/ajax/libs/gsap/1.14.2/TweenMax.min.js'></script><script  src="./script.js"></script>

  </body>
  
</html>
